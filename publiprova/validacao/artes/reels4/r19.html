<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<!-- R19 — o print veio cortado. O creator manda o print dos insights, mas o
     recorte do celular dele comeu justamente a linha do alcance. O número que
     falta é o único que o cliente pede. Nomes e números são de demonstração. -->
<style>
  .fundo { position: absolute; inset: 0; background: #0b141a; }
  .zap { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; }
  .topo { display: flex; align-items: center; gap: 12px; padding: 36px 16px 10px; background: #202c33; flex: none; color: #e9edef; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: #c0392b; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #fff; }
  .nm { font-size: 16px; font-weight: 600; }
  .sub { font-size: 12px; color: #8696a0; margin-top: 2px; }
  .corpo { flex: 1; padding: 150px 14px 18px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; }
  .bal { max-width: 80%; border-radius: 9px; padding: 6px 8px 5px; font-size: 15px; line-height: 1.3; opacity: 0; color: #e9edef; }
  .esq { background: #202c33; align-self: flex-start; }
  .dir { background: #005c4b; align-self: flex-end; }
  .hr { font-size: 10.5px; color: #8696a0; float: right; margin: 6px 0 0 8px; }

  /* O print que ele mandou, dentro do balão. */
  .shot { width: 232px; border-radius: 6px; overflow: hidden; background: #fff; color: #111; }
  .shot .cab { background: #fafafa; border-bottom: 1px solid #dbdbdb; padding: 7px 9px; font-size: 11px; font-weight: 700; color: #262626; }
  .shot .linha { display: flex; justify-content: space-between; padding: 7px 9px; font-size: 12px; border-bottom: 1px solid #efefef; }
  .shot .linha b { font-variant-numeric: tabular-nums; }
  .shot .cortada { position: relative; }
  /* A borda de baixo do print: a última linha está pela metade. */
  .shot .meia { height: 13px; overflow: hidden; }
  .seta { position: absolute; right: -8px; bottom: 2px; width: 0; height: 0; }

  /* Posição vem do JS: medida do elemento, não chute. */
  .lupa { position: absolute; border: 3px solid #ff3b30; border-radius: 8px; opacity: 0; pointer-events: none; z-index: 55; }
  .etq { position: absolute; transform: translateX(-50%); background: #ff3b30; color: #fff; font-size: 16px; font-weight: 800; padding: 5px 12px; border-radius: 8px; opacity: 0; white-space: nowrap; z-index: 55; }

  .gancho { top: 34px; }
  #fecho { position: absolute; left: 30px; right: 30px; top: 700px; display: flex; justify-content: center; z-index: 60; opacity: 0; }
</style></head>
<body><div class="quadro">
  <div class="fundo"></div>
  <div class="zap">
    <div class="topo"><div class="av">LM</div><div><div class="nm">Lara M. (creator)</div><div class="sub">online</div></div></div>
    <div class="corpo" id="corpo"></div>
  </div>
  <div class="lupa" id="lupa"></div>
  <div class="etq" id="etq">cadê o alcance?</div>
  <div class="gancho"><div class="pilula grande">mandou o print 🎉<br>cortou o alcance</div></div>
  <div id="fecho"><div class="pilula grande">de volta pro WhatsApp</div></div>
</div>
<script src="motor.js"></script>
<script>
  window.DUR = 8.0;

  const corpo = document.getElementById("corpo");
  const itens = [
    { eu: true,  t: "oi Lara! manda o print dos insights quando der 🙏", h: "14:02", ini: 0.9 },
    { eu: false, t: "ta aqui!", h: "15:47", ini: 1.9 },
    { eu: false, shot: true, h: "15:47", ini: 2.4 },
    { eu: true,  t: "obrigado! só que cortou o alcance 😅", h: "15:52", ini: 5.6 },
    { eu: true,  t: "consegue mandar de novo?", h: "15:52", ini: 6.3 },
  ];

  const els = itens.map((it) => {
    const el = document.createElement("div");
    el.className = "bal " + (it.eu ? "dir" : "esq");
    if (it.shot) {
      el.innerHTML = `<div class="shot">
        <div class="cab">Insights do story</div>
        <div class="linha"><span>Impressões</span><b>4.812</b></div>
        <div class="linha"><span>Interações</span><b>126</b></div>
        <div class="linha"><span>Toques no link</span><b>38</b></div>
        <div class="linha meia"><span>Contas alcançadas</span><b>3.9</b></div>
      </div><span class="hr">${it.h}</span>`;
    } else {
      el.innerHTML = `<span>${it.t}</span><span class="hr">${it.h}${it.eu ? " ✓✓" : ""}</span>`;
    }
    corpo.appendChild(el);
    return el;
  });

  const lupa = document.getElementById("lupa");
  const etq = document.getElementById("etq");
  const fecho = document.getElementById("fecho");
  const meia = document.querySelector(".shot .meia");

  window.setT = (t) => {
    els.forEach((el, i) => entra(el, t, itens[i].ini, 0.22, 12));
    // A marcação é colada na linha cortada MEDINDO o elemento, porque a conversa
    // é ancorada embaixo e tudo sobe quando chega mensagem nova. Posição fixa
    // apontava para o vazio.
    const r = meia.getBoundingClientRect();
    lupa.style.top = (r.top - 5) + "px";
    lupa.style.left = (r.left - 7) + "px";
    lupa.style.width = (r.width + 14) + "px";
    lupa.style.height = (r.height + 10) + "px";
    etq.style.top = (r.bottom + 10) + "px";
    etq.style.left = (r.left + r.width / 2) + "px";
    janela(lupa, t, 3.4, 5.5, 0.18);
    janela(etq, t, 3.7, 5.5, 0.18);
    entra(fecho, t, 7.0, 0.3, 14);
  };
  setT(0);
</script></body></html>
