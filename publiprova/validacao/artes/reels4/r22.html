<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<!-- R22 — você pede o print, ele manda um áudio de 4 min. A conversa enche o
     quadro inteiro de propósito: conversa curta com fundo vazio parece erro. -->
<style>
  .wa { position: absolute; inset: 0; background: #0b141a; color: #e9edef; display: flex; flex-direction: column; }
  .status { height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 8px 20px 0; font-size: 13px; font-weight: 600; color: #fff; flex: none; }
  .topo { display: flex; align-items: center; gap: 11px; padding: 8px 15px 9px; background: #202c33; flex: none; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: #2980b9; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #fff; }
  .nm { font-size: 16px; font-weight: 600; }
  .sub { font-size: 12px; color: #8696a0; margin-top: 1px; }
  .fluxo { flex: 1; padding: 14px 12px 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 7px; }
  .dia { align-self: center; background: #182229; color: #8696a0; font-size: 11px; font-weight: 600; padding: 4px 11px; border-radius: 8px; margin: 4px 0 1px; opacity: 0; }
  .bal { max-width: 78%; border-radius: 9px; padding: 7px 10px 5px; font-size: 15px; line-height: 1.32; opacity: 0; }
  .bal .hr { font-size: 10.5px; color: #8696a0; float: right; margin: 5px 0 0 8px; }
  .esq { background: #202c33; align-self: flex-start; }
  .dir { background: #005c4b; align-self: flex-end; }

  /* O áudio: play, onda e a duração que é a piada. */
  .aud { display: flex; align-items: center; gap: 9px; min-width: 252px; }
  .play { width: 30px; height: 30px; border-radius: 50%; background: #e9edef; flex: none; position: relative; }
  .play::after { content: ""; position: absolute; left: 11px; top: 8px; border-left: 11px solid #202c33; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
  .onda { flex: 1; display: flex; align-items: center; gap: 2px; height: 22px; }
  .onda i { flex: 1; background: #8696a0; border-radius: 1px; }
  .dur { font-size: 12px; color: #8696a0; font-variant-numeric: tabular-nums; font-weight: 700; }
  .dur.gritando { color: #ff6b6b; font-size: 14px; font-weight: 800; }

  .gancho { top: 118px; }
  #fecho { position: absolute; left: 28px; right: 28px; top: 712px; display: flex; justify-content: center; z-index: 60; opacity: 0; }
</style></head>
<body><div class="quadro">
  <div class="wa">
    <div class="status"><span>21:14</span><span>▮▮▮ 5G ▭</span></div>
    <div class="topo"><div class="av">RC</div><div><div class="nm">Rafa (cozinha)</div><div class="sub">visto por último hoje às 21:03</div></div></div>
    <div class="fluxo" id="fluxo"></div>
  </div>
  <div class="gancho"><div class="pilula grande">pedi o print<br>veio um áudio de 4 min</div></div>
  <div id="fecho"><div class="pilula grande">e o print? continua não vindo</div></div>
</div>
<script src="motor.js"></script>
<script>
  window.DUR = 8.5;

  const itens = [
    { dia: "ONTEM", ini: 0.5 },
    { eu: true,  t: "oi Rafa! tudo certo? só falta o print dos insights 🙏", h: "14:20", ini: 0.8 },
    { eu: false, t: "opa! deixa eu te explicar uma coisa", h: "14:58", ini: 1.5 },
    { eu: false, audio: "4:12", h: "14:58", ini: 2.1 },
    { eu: true,  t: "ouvi! mas então, o print 😅", h: "15:30", ini: 3.2 },
    { eu: false, t: "é que o insights sumiu do meu perfil", h: "18:11", ini: 3.9 },
    { eu: false, audio: "2:47", h: "18:11", ini: 4.5 },
    { dia: "HOJE", ini: 5.2 },
    { eu: true,  t: "bom dia! consegue hoje?", h: "09:05", ini: 5.5 },
    { eu: false, audio: "6:03", h: "21:03", ini: 6.2 },
  ];

  const fluxo = document.getElementById("fluxo");
  const els = itens.map((it) => {
    const el = document.createElement("div");
    if (it.dia) { el.className = "dia"; el.textContent = it.dia; return fluxo.appendChild(el), el; }
    el.className = "bal " + (it.eu ? "dir" : "esq");
    if (it.audio) {
      // Barras com alturas fixas: o quadro N tem de sair igual toda vez.
      const alturas = [6,13,8,19,11,22,9,16,7,20,12,18,6,14,10,21,8,15,11,17,7,19,9,13];
      const barras = alturas.map((h) => `<i style="height:${h}px"></i>`).join("");
      const grita = it.audio === "6:03" ? " gritando" : "";
      el.innerHTML = `<div class="aud"><div class="play"></div><div class="onda">${barras}</div><span class="dur${grita}">${it.audio}</span></div><span class="hr">${it.h}</span>`;
    } else {
      el.innerHTML = `<span>${it.t}</span><span class="hr">${it.h}${it.eu ? " ✓✓" : ""}</span>`;
    }
    fluxo.appendChild(el);
    return el;
  });

  const fecho = document.getElementById("fecho");
  window.setT = (t) => {
    els.forEach((el, i) => entra(el, t, itens[i].ini, 0.22, 12));
    entra(fecho, t, 7.4, 0.3, 14);
  };
  setT(0);
</script></body></html>
